services:
  - type: web
    name: tayyib
    runtime: python
    plan: free
    # Le cache de l'univers est construit au build : les fondamentaux ne
    # bougent qu'une fois par trimestre, et interroger Yahoo à chaque
    # requête serait à la fois lent et vite bloqué (HTTP 429).
    #
    # Si Yahoo limite le débit depuis les adresses de l'hébergeur, le
    # build reste vert et l'application démarre avec un cache vide, en
    # l'annonçant clairement plutôt qu'en tombant. Relancer le déploiement
    # suffit alors.
    buildCommand: "pip install -r requirements.txt && python refresh.py || true"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
